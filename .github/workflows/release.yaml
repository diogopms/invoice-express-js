name: Release

# Releases are NOT cut on merge to main — pushes only run CI (ci.yaml).
# Instead this job runs on a schedule (monthly): it determines the next
# version from the conventional commits since the last tag. Only if there is a
# release-worthy change (a feat/fix/breaking-change commit) does it create the
# git tag, publish the package to BOTH the public npm registry and GitHub
# Packages, and cut a GitHub Release. If nothing releasable has landed since
# the last tag, `new_version` is empty and every step is skipped — a no-op.
#
# To FORCE a release (e.g. after a docs-only change), trigger it manually and
# pick a bump level:
#   * GitHub UI: Actions > Release > "Run workflow" > set "bump" to patch/minor/major.
#   * CLI:       gh workflow run release.yaml -f bump=patch
# With `bump=auto` (the default) a manual run behaves exactly like the schedule:
# it releases only if a feat/fix/breaking-change commit has landed.
#
# Two publish targets, both token-authenticated. The "Configure registry auth"
# step writes the per-registry _authToken lines into a runtime .npmrc (the
# tokens are GitHub Actions secret expressions rendered into the script, never
# committed):
#  * npm (registry.npmjs.org) — classic automation token in the NPM_TOKEN repo
#    secret. Create it at npmjs.com > Access Tokens (type "Automation", or a
#    granular token with publish on @diogopms/invoice-express-js), then add it
#    under repo Settings > Secrets and variables > Actions as NPM_TOKEN.
#  * GitHub Packages (npm.pkg.github.com) — the built-in GITHUB_TOKEN.
on:
  schedule:
    - cron: "0 5 1 * *" # monthly (first of the month, 05:00 UTC)
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a release with this bump when no releasable commits exist (auto = behave like the schedule)"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # publish to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0

      # Compute the next version from the Conventional Commits since the last
      # tag. `skip-commit`/`skip-version-file` make the action read the current
      # version from git tags (not from a version file), and with the
      # `conventionalcommits` preset the commit types hidden from the changelog
      # (docs, test, ci, chore, ...) yield an empty changelog, which
      # `skip-on-empty` turns into a skipped run - the same "nothing releasable
      # -> no release" behavior as before. The action creates and pushes the
      # git tag itself (as before); no changelog file is committed.
      - name: Determine next version
        if: github.event_name != 'workflow_dispatch' || inputs.bump == 'auto'
        id: bump
        uses: TriPSs/conventional-changelog-action@ee43def3241429afddab215ba89090cbf64fb45c # v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-prefix: ""
          preset: conventionalcommits
          output-file: false
          skip-version-file: true
          skip-commit: true
          skip-tag: false
          git-push: true
          skip-git-pull: true
          skip-on-empty: true

      # Manual override: a workflow_dispatch run with bump=patch|minor|major
      # forces that bump from the latest tag even when no releasable commit
      # exists (e.g. after a docs-only change).
      - name: Determine next version (manual bump)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'auto'
        id: manual
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION=$LAST_TAG
          VERSION=${VERSION:-0.0.0}
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          git tag "$NEW_VERSION"
          git push origin "refs/tags/$NEW_VERSION"
          {
            echo "version=$NEW_VERSION"
            echo "tag=$NEW_VERSION"
            echo "changelog<<CHANGELOG_EOF"
            git log ${LAST_TAG:+"$LAST_TAG..HEAD"} --pretty='* %s (%h)'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Merge both paths into the `tag` outputs every later step reads.
      # `new_version` stays empty when there is nothing to release, keeping the
      # `if: steps.tag.outputs.new_version` guards working unchanged.
      - name: Resolve next version
        id: tag
        env:
          MANUAL_VERSION: ${{ steps.manual.outputs.version }}
          MANUAL_TAG: ${{ steps.manual.outputs.tag }}
          MANUAL_CHANGELOG: ${{ steps.manual.outputs.changelog }}
          AUTO_SKIPPED: ${{ steps.bump.outputs.skipped }}
          AUTO_VERSION: ${{ steps.bump.outputs.version }}
          AUTO_TAG: ${{ steps.bump.outputs.tag }}
          AUTO_CHANGELOG: ${{ steps.bump.outputs.changelog }}
        run: |
          set -euo pipefail
          NEW_VERSION=""
          NEW_TAG=""
          CHANGELOG=""
          if [ -n "$MANUAL_VERSION" ]; then
            NEW_VERSION=$MANUAL_VERSION
            NEW_TAG=$MANUAL_TAG
            CHANGELOG=$MANUAL_CHANGELOG
          elif [ "$AUTO_SKIPPED" = "false" ] && [ -n "$AUTO_VERSION" ]; then
            NEW_VERSION=$AUTO_VERSION
            NEW_TAG=$AUTO_TAG
            CHANGELOG=$AUTO_CHANGELOG
          fi
          {
            echo "new_version=$NEW_VERSION"
            echo "new_tag=$NEW_TAG"
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        if: steps.tag.outputs.new_version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        name: Install pnpm
        if: steps.tag.outputs.new_version
        with:
          run_install: false

      - name: Get pnpm store directory
        if: steps.tag.outputs.new_version
        id: pnpm-cache-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        name: Setup pnpm cache
        if: steps.tag.outputs.new_version
        with:
          path: ${{ steps.pnpm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Install dependencies
        if: steps.tag.outputs.new_version
        run: pnpm install --frozen-lockfile

      - name: Set package version
        if: steps.tag.outputs.new_version
        run: npm version "${{ steps.tag.outputs.new_version }}" --no-git-tag-version --allow-same-version

      - name: Build
        if: steps.tag.outputs.new_version
        run: pnpm build

      # Write per-registry auth into a runtime .npmrc. The tokens are GitHub
      # Actions secret expressions substituted into the script at render time
      # (not shell env vars); this file lives only on the runner.
      - name: Configure registry auth
        if: steps.tag.outputs.new_version
        run: |
          {
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          } >> .npmrc

      - name: Publish to npm
        if: steps.tag.outputs.new_version
        run: npm publish --registry=https://registry.npmjs.org

      - name: Publish to GitHub Packages
        if: steps.tag.outputs.new_version
        run: npm publish --registry=https://npm.pkg.github.com

      # Remove the token file as soon as publishing is done, so later steps
      # (e.g. the release-creation action) never see the credentials on disk.
      - name: Remove registry credentials
        if: always()
        run: rm -f .npmrc

      - name: Create GitHub Release
        if: steps.tag.outputs.new_version
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
